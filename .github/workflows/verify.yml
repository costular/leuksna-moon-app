name: Android verification

on:
  workflow_call:
    inputs:
      run-instrumentation:
        description: Run API 36 emulator instrumentation tests.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Android verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Clone repo
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12

      - name: Run static analysis and unit tests
        run: ./gradlew ktlintCheck lintDebug testDebugUnitTest assembleDebug processReleaseMainManifest --no-daemon

      - name: Verify release manifest excludes advertising IDs
        run: |
          manifest=app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
          test -f "$manifest"
          if rg --fixed-strings \
            -e 'com.google.android.gms.permission.AD_ID' \
            -e 'android.permission.ACCESS_ADSERVICES_AD_ID' \
            -e 'android.permission.ACCESS_ADSERVICES_ATTRIBUTION' \
            "$manifest"; then
            echo 'Release manifest still contains advertising-ID permissions.' >&2
            exit 1
          fi

      - name: Enable KVM
        if: inputs.run-instrumentation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests on API 36
        if: inputs.run-instrumentation
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-verification-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
            app/build/outputs/androidTest-results/**
            app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
          if-no-files-found: warn
          retention-days: 14
