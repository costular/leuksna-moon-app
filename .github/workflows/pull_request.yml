name: Pull Request

on:
  pull_request:
    branches:
      - develop
      - master

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:

  verify:
    name: Android verification
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v5

      - name: Review new dependencies
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          license-check: false
