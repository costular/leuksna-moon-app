[versions]
agp = "9.2.1"
versionsPlugin = "0.54.0"
googleServices = "4.4.4"
firebaseCrashlyticsPlugin = "3.0.6"
ktlint = "14.2.0"
playPublisher = "4.0.0"
appcompat = "1.7.1"
coreKtx = "1.17.0"
lifecycle = "2.11.0"
constraintLayout = "2.2.2"
material = "1.14.0"
navigation = "2.9.6"
koin = "4.2.2"
coroutines = "1.11.0"
uniflow = "1.1.2"
calendar = "2.10.1"
flowPreferences = "1.9.1"
playServicesLocation = "21.4.0"
firebaseBom = "34.17.0"
junit = "4.13.2"
mockk = "1.14.11"
fragment = "1.8.9"
androidxTestExtJunit = "1.3.0"
espresso = "3.7.0"
kaspresso = "1.6.1"

[libraries]
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintLayout" }
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-navigation-fragment-ktx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }
androidx-navigation-testing = { module = "androidx.navigation:navigation-testing", version.ref = "navigation" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
uniflow-android = { module = "org.uniflow-kt:uniflow-android", version.ref = "uniflow" }
calendar-view = { module = "com.kizitonwose.calendar:view", version.ref = "calendar" }
flow-preferences = { module = "com.fredporciuncula:flow-preferences", version.ref = "flowPreferences" }
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
kastro = { module = "dev.jamesyox:kastro", version = "0.5.0" }
junit = { module = "junit:junit", version.ref = "junit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
androidx-fragment-testing = { module = "androidx.fragment:fragment-testing", version.ref = "fragment" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
kaspresso = { module = "com.kaspersky.android-components:kaspresso", version.ref = "kaspresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsPlugin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
play-publisher = { id = "com.github.triplet.play", version.ref = "playPublisher" }
versions = { id = "com.github.ben-manes.versions", version.ref = "versionsPlugin" }
